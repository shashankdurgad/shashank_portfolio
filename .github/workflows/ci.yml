name: CI

on:
  push:
    branches: [main, v3-claude]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # LayoutProps and friends are generated types; tsc can't see them until
      # typegen has run.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
